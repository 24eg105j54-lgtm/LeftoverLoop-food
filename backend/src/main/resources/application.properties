# Server configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# Load optional .env file if present (checks backend/.env and root .env)
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Database Configuration (Configured through environment variables or .env file)
# Aiven Cloud MySQL:
#   SPRING_DATASOURCE_URL=jdbc:mysql://<host>:<port>/<dbname>?sslMode=REQUIRED&useSSL=true&requireSSL=true&verifyServerCertificate=false
#   SPRING_DATASOURCE_USERNAME=<aiven-user>
#   SPRING_DATASOURCE_PASSWORD=<aiven-password>
#
# Local MySQL:
#   SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/leftoverloop_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
#   SPRING_DATASOURCE_USERNAME=<local-user>
#   SPRING_DATASOURCE_PASSWORD=<local-password>
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/leftoverloop}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Recommendation Configuration
ai.api.key=${AI_API_KEY:}
ai.api.provider=${AI_PROVIDER:gemini}
ai.api.url=${AI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent}

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Jackson JSON formatting
spring.jackson.serialization.write-dates-as-timestamps=false
