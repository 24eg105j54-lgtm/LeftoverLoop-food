<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - LeftoverLoop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">LL</div>
      <span>LeftoverLoop</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="receiver.html" class="nav-link">Browse Food</a></li>
    </ul>
    <div id="navAuthContainer"></div>
  </nav>

  <div class="container" style="max-width: 550px; margin-top: 2rem; margin-bottom: 4rem;">
    <div class="glass-card" style="padding: 2.5rem;">
      <h2 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem;">Create an Account</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">Join LeftoverLoop to rescue surplus food and eliminate hunger</p>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="regFullName">Full Name / Contact Person</label>
          <input type="text" id="regFullName" class="form-control" placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regEmail">Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regPassword">Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="regRole">Account Role</label>
          <select id="regRole" class="form-control" required>
            <option value="ROLE_DONOR">DONOR (Restaurant, Hotel, Caterer, Grocery, Individual)</option>
            <option value="ROLE_RECEIVER">RECEIVER (Community Individual, Family, Shelter)</option>
            <option value="ROLE_ORGANIZATION">ORGANIZATION (Food Bank, NGO, Charity Foundation)</option>
            <option value="ROLE_ADMIN">ADMINISTRATOR (System Auditor / Manager)</option>
          </select>
        </div>

        <div class="form-group" id="groupOrgName">
          <label class="form-label" for="regOrgName">Organization / Business Name (Optional)</label>
          <input type="text" id="regOrgName" class="form-control" placeholder="Grand Hotel & Bakery">
        </div>

        <div class="grid-3" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div class="form-group">
            <label class="form-label" for="regPhone">Phone Number</label>
            <input type="tel" id="regPhone" class="form-control" placeholder="+1 555-0199">
          </div>
          <div class="form-group">
            <label class="form-label" for="regAddress">City / Location</label>
            <input type="text" id="regAddress" class="form-control" placeholder="Downtown District">
          </div>
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 1rem;">Complete Registration</button>
      </form>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Already have an account? <a href="login.html">Sign in here</a>
      </p>
    </div>
  </div>

  <footer>
    <p>© 2026 LeftoverLoop Food Redistribution System.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
