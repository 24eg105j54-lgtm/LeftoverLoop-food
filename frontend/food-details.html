<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Item Details - LeftoverLoop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">LL</div>
      <span>LeftoverLoop</span>
    </a>
    <ul class="nav-links">
      <li><a href="receiver.html" class="nav-link">Browse Food</a></li>
      <li><a href="requests.html" class="nav-link">My Requests</a></li>
      <li><a href="impact.html" class="nav-link">Impact Report</a></li>
    </ul>
    <div id="navAuthContainer"></div>
  </nav>

  <div class="container" style="max-width: 900px; margin-top: 2rem; margin-bottom: 4rem;">
    <div id="foodDetailsCard" class="glass-card" style="padding: 2.5rem;">
      <p style="color: var(--text-muted); text-align: center;">Loading food item details...</p>
    </div>
  </div>

  <footer>
    <p>© 2026 LeftoverLoop Food Redistribution System.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get('id');
      if (!id) {
        window.location.href = 'receiver.html';
        return;
      }

      try {
        const item = await ApiClient.getDonationById(id);
        const card = document.getElementById('foodDetailsCard');
        const risk = typeof getFoodRiskInfo === 'function' ? getFoodRiskInfo(item) : null;
        const expiryAlert = typeof getExpiryAlertBadge === 'function' ? getExpiryAlertBadge(item.expiryDate) : '';

        card.innerHTML = `
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; align-items: start;">
            <div>
              <img src="${item.imageUrl || 'https://images.unsplash.com/photo-1555244162-803834f70033?w=600'}" style="width: 100%; border-radius: var(--radius-md); height: 320px; object-fit: cover;" alt="${item.title}" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1555244162-803834f70033?w=600';">
              ${risk ? `
                <div style="margin-top: 1rem; padding: 1rem; background: rgba(15, 23, 42, 0.6); border-radius: var(--radius-sm); border: 1px solid var(--glass-border);">
                  <div style="font-size: 0.85rem; font-weight: 700; margin-bottom: 0.35rem;">Food Safety & Risk Indicator:</div>
                  <span class="badge ${risk.badgeClass}">🛡️ ${risk.label}</span>
                  <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.4rem;">${risk.reason}</p>
                  <p style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.4rem; font-style: italic;">* ${risk.disclaimer}</p>
                </div>
              ` : ''}
            </div>

            <div>
              <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; flex-wrap: wrap;">
                <div>
                  <span class="badge badge-green">${item.category}</span>
                  ${expiryAlert}
                </div>
                ${renderStatusBadge(item.statusColor, item.status)}
              </div>

              <h1 style="font-size: 2rem; margin-top: 0.5rem; margin-bottom: 0.75rem;">${item.title}</h1>
              <p style="color: var(--text-muted); margin-bottom: 1.25rem;">${item.description || 'No detailed description provided.'}</p>

              <div class="glass-card" style="padding: 1rem; margin-bottom: 1.25rem; background: rgba(15, 23, 42, 0.6);">
                <div style="font-size: 0.85rem; color: var(--text-muted);">Available Quantity Status:</div>
                <div style="font-size: 1.4rem; font-weight: 800; color: var(--accent-green);">${item.remainingQuantity} / ${item.initialQuantity} ${item.unit}</div>
                <div class="quantity-bar" style="margin-top: 0.5rem;">
                  <div class="quantity-fill" style="width: ${(item.remainingQuantity / item.initialQuantity) * 100}%;"></div>
                </div>
              </div>

              <div style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1.5rem;">
                <div style="margin-bottom: 0.4rem;">📍 <strong>Location:</strong> ${item.location}</div>
                <div style="margin-bottom: 0.4rem;">🕒 <strong>Expiry Date:</strong> ${formatDate(item.expiryDate)} (${getTimeRemainingText(item.expiryDate)})</div>
                <div style="margin-bottom: 0.4rem;">👨‍🍳 <strong>Donor / Organization:</strong> ${item.donorOrganization || item.donorName}</div>
                <div>📝 <strong>Pickup Instructions:</strong> ${item.pickupInstructions || 'Standard pickup'}</div>
              </div>

              ${item.remainingQuantity > 0 && !item.expired ? `
                <a href="receiver.html" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 0.8rem;">Request Food Item</a>
              ` : `
                <button class="btn btn-secondary" disabled style="width: 100%;">Currently Unavailable or Expired</button>
              `}
            </div>
          </div>
        `;
      } catch (err) {
        document.getElementById('foodDetailsCard').innerHTML = `<p style="color: var(--accent-red); text-align: center;">Error loading details: ${err.message}</p>`;
      }
    });
  </script>
</body>
</html>
