<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - LeftoverLoop</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="navbar-brand">
      <div class="brand-icon">LL</div>
      <span>LeftoverLoop</span>
    </a>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">Home</a></li>
      <li><a href="receiver.html" class="nav-link">Browse Food</a></li>
    </ul>
    <div id="navAuthContainer"></div>
  </nav>

  <div class="container" style="max-width: 480px; margin-top: 3rem; margin-bottom: 4rem;">
    <div class="glass-card" style="padding: 2.5rem;">
      <h2 style="text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem;">Welcome Back</h2>
      <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem;">Sign in to manage food donations and requests</p>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-control" placeholder="name@domain.com" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" id="btnLoginSubmit" class="btn btn-primary" style="width: 100%; padding: 0.8rem; margin-top: 0.5rem;">Sign In</button>
      </form>

      <!-- Quick Demo Logins for Instant Testing -->
      <div style="margin-top: 2rem; border-top: 1px solid var(--glass-border); padding-top: 1.5rem;">
        <p style="font-size: 0.85rem; color: var(--text-muted); text-align: center; margin-bottom: 0.75rem;">⚡ Quick Demo Login Shortcuts:</p>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
          <button type="button" onclick="quickLogin('donor@grandplaza.com', 'password123')" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.4rem;">👨‍🍳 Donor</button>
          <button type="button" onclick="quickLogin('receiver@shelter.org', 'password123')" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.4rem;">🙌 Receiver</button>
          <button type="button" onclick="quickLogin('contact@foodrescuengo.org', 'password123')" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.4rem;">🏢 Organization</button>
          <button type="button" onclick="quickLogin('admin@leftoverloop.org', 'password123')" class="btn btn-secondary" style="font-size: 0.8rem; padding: 0.4rem;">⚡ Admin</button>
        </div>
      </div>

      <p style="text-align: center; margin-top: 1.5rem; color: var(--text-muted); font-size: 0.9rem;">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <footer>
    <p>© 2026 LeftoverLoop Food Redistribution System.</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
